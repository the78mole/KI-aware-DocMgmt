name: marker Image

on:
  push:
    branches: [main]
    paths: ["deploy/marker/**", ".github/workflows/marker-image.yml"]
  pull_request:
    paths: ["deploy/marker/**", ".github/workflows/marker-image.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ki-aware-docmgmt-marker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: marker-Version aus dem Dockerfile lesen
        id: version
        run: echo "marker=$(sed -n 's/^ARG MARKER_VERSION=//p' deploy/marker/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.marker }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=ki-aware-docmgmt-marker
            org.opencontainers.image.description=marker-pdf ${{ steps.version.outputs.marker }} als HTTP-Dienst, nur CPU

      # Auf PRs nur bauen, damit Änderungen am Dockerfile vor dem Merge geprüft sind
      - uses: docker/build-push-action@v7
        with:
          context: deploy/marker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zusammenfassung
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 🐳 marker-Image
          \`\`\`
          ${{ steps.meta.outputs.tags }}
          \`\`\`
          EOF
