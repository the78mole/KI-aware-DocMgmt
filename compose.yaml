# Lokaler Stack: DocMgmt + PostgreSQL + Garage (S3).
# Secrets kommen aus .env, siehe scripts/dev-secrets.sh. Später werden Garage und marker
# durch die externen Dienste ersetzt, dafür nur die S3_*-Variablen umstellen.

x-s3-env: &s3-env
  S3_BUCKET: ${S3_BUCKET:-docmgmt}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID fehlt, scripts/dev-secrets.sh ausführen}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY fehlt}

services:
  docmgmt:
    image: ki-aware-docmgmt:local
    build: .
    ports:
      - "${DOCMGMT_PORT:-8000}:8000"
    environment:
      <<: *s3-env
      DATABASE_URL: postgresql+psycopg://docmgmt:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@postgres:5432/docmgmt
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: docmgmt
      POSTGRES_DB: docmgmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmgmt -d docmgmt"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET fehlt}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN fehlt}
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
    restart: unless-stopped

  # nutzt das DocMgmt-Image, weil es Python schon mitbringt
  garage-init:
    image: ki-aware-docmgmt:local
    pull_policy: never
    command: ["python", "/init.py"]
    environment:
      <<: *s3-env
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN fehlt}
    volumes:
      - ./deploy/garage/init.py:/init.py:ro
    depends_on:
      - garage

volumes:
  postgres-data:
  garage-meta:
  garage-data:
